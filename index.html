<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Quest // Imanel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(255, 120, 200, 0.18),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 80%,
                    rgba(100, 180, 255, 0.15),
                    transparent 30%
                ),

                #08080d;

            color: #f5f5f5;

            font-family: "Courier New", monospace;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* SCANLINES */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(255,255,255,0.025) 0px,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px,
                    transparent 4px
                );

            pointer-events: none;
            z-index: 100;
        }


        /* BOOT SCREEN */

        #boot {
            position: fixed;
            inset: 0;

            background: #050508;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            z-index: 50;

            transition:
                opacity 1s ease,
                visibility 1s ease;
        }


        #boot.hide {
            opacity: 0;
            visibility: hidden;
        }


        .boot-title {
            font-size: 15px;
            letter-spacing: 4px;
            color: #aaa;
            margin-bottom: 30px;
        }


        .boot-text {
            width: 300px;

            color: #8ac7ff;

            font-size: 12px;
            line-height: 1.8;

            min-height: 90px;
        }


        .progress-container {
            width: 300px;
            height: 6px;

            border: 1px solid #444;

            margin-top: 20px;

            overflow: hidden;
        }


        .progress {
            width: 0%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #ff8fd8,
                    #9ed6ff
                );

            box-shadow:
                0 0 12px rgba(255,150,220,0.5);

            transition:
                width 0.15s linear;
        }


        .loading-percent {
            margin-top: 12px;

            font-size: 11px;

            color: #666;

            letter-spacing: 2px;
        }


        /* MAIN WINDOW */

        #main {
            width: min(700px, 90%);

            padding: 3px;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #ff8fd8,
                    #8ac7ff,
                    #ffffff
                );

            border-radius: 10px;

            box-shadow:
                0 0 25px rgba(255,120,220,0.25),
                0 0 60px rgba(100,180,255,0.12);

            opacity: 0;

            transform:
                scale(0.95)
                translateY(10px);

            transition:
                opacity 1s ease,
                transform 1s ease;
        }


        #main.show {
            opacity: 1;

            transform:
                scale(1)
                translateY(0);
        }


        .window-inner {
            background:
                rgba(10,10,17,0.96);

            border-radius: 7px;

            overflow: hidden;
        }


        /* TOP BAR */

        .topbar {
            height: 38px;

            padding: 0 14px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                linear-gradient(
                    90deg,
                    #171722,
                    #252537
                );

            border-bottom:
                1px solid rgba(255,255,255,0.08);

            font-size: 12px;

            color: #aaa;
        }


        .dots {
            display: flex;
            gap: 6px;
        }


        .dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #777;
        }


        /* CONTENT */

        .content {
            padding: 70px 30px;

            text-align: center;
        }


        .system {
            font-size: 12px;

            color: #8ac7ff;

            margin-bottom: 20px;

            letter-spacing: 2px;
        }


        .system::before {
            content: "> ";
        }


        .title {
            font-size:
                clamp(34px, 7vw, 64px);

            margin: 0;

            letter-spacing: 5px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #ff9cda,
                    #9ed6ff,
                    #ffffff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            animation:
                glow 3s ease-in-out infinite;
        }


        @keyframes glow {

            0%, 100% {
                filter:
                    drop-shadow(
                        0 0 4px
                        rgba(255,255,255,0.2)
                    );
            }

            50% {
                filter:
                    drop-shadow(
                        0 0 14px
                        rgba(255,150,220,0.45)
                    );
            }
        }


        .subtitle {
            margin-top: 15px;

            color: #aaa;

            font-size: 14px;

            letter-spacing: 3px;
        }


        .player {
            margin-top: 45px;

            font-size: 13px;

            color: #777;
        }


        .player span {
            display: block;

            margin-top: 8px;

            color: #fff;

            font-size: 20px;

            letter-spacing: 4px;
        }


        .date {
            margin-top: 25px;

            color: #ff9cda;

            font-size: 13px;

            letter-spacing: 4px;
        }


        /* BUTTON */

        .begin {
            margin-top: 45px;

            padding: 14px 32px;

            border:
                1px solid rgba(255,255,255,0.5);

            border-radius: 5px;

            background:
                rgba(255,255,255,0.04);

            color: white;

            font-family:
                "Courier New",
                monospace;

            font-size: 13px;

            letter-spacing: 3px;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .begin:hover {
            transform:
                translateY(-3px);

            background:
                rgba(255,150,220,0.12);

            box-shadow:
                0 0 15px
                rgba(255,150,220,0.3);
        }


        .begin:active {
            transform:
                translateY(0);
        }


        .footer {
            margin-top: 35px;

            font-size: 10px;

            color: #555;

            letter-spacing: 2px;
        }


        /* FLOATING STARS */

        .star {
            position: fixed;

            color:
                rgba(255,255,255,0.6);

            font-size: 12px;

            animation:
                float 4s ease-in-out infinite;
        }


        .star:nth-child(1) {
            top: 15%;
            left: 15%;
        }


        .star:nth-child(2) {
            top: 25%;
            right: 18%;

            animation-delay: 1s;
        }


        .star:nth-child(3) {
            bottom: 20%;
            left: 20%;

            animation-delay: 2s;
        }


        .star:nth-child(4) {
            bottom: 15%;
            right: 15%;

            animation-delay: 1.5s;
        }


        @keyframes float {

            0%, 100% {
                transform:
                    translateY(0);

                opacity: 0.4;
            }

            50% {
                transform:
                    translateY(-10px);

                opacity: 1;
            }
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .content {
                padding:
                    55px 20px;
            }


            .title {
                letter-spacing: 2px;
            }


            .subtitle {
                font-size: 11px;

                letter-spacing: 2px;
            }


            .player span {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>


    <!-- BOOT SCREEN -->

    <div id="boot">

        <div class="boot-title">
            BIRTHDAY_QUEST.exe
        </div>


        <div
            class="boot-text"
            id="bootText">
        </div>


        <div class="progress-container">

            <div
                class="progress"
                id="progress">
            </div>

        </div>


        <div
            class="loading-percent"
            id="percent">

            0%

        </div>

    </div>



    <!-- FLOATING STARS -->

    <div class="star">✦</div>

    <div class="star">✧</div>

    <div class="star">✦</div>

    <div class="star">✧</div>



    <!-- MAIN -->

    <div id="main">

        <div class="window-inner">


            <div class="topbar">

                <div>
                    BIRTHDAY_QUEST.exe
                </div>


                <div class="dots">

                    <div class="dot"></div>

                    <div class="dot"></div>

                    <div class="dot"></div>

                </div>

            </div>



            <div class="content">


                <div class="system">
                    SYSTEM INITIALIZED
                </div>


                <h1 class="title">
                    BIRTHDAY QUEST
                </h1>


                <div class="subtitle">
                    A LITTLE SOMETHING FOR YOU
                </div>



                <div class="player">

                    PLAYER DETECTED

                    <span>
                        IMANEL
                    </span>

                </div>



                <div class="date">

                    09 . 09 . 2026

                </div>



                <button
                    class="begin"
                    onclick="startQuest()">

                    [ BEGIN THE QUEST ]

                </button>



                <div class="footer">

                    ♡ MADE SPECIALLY FOR YOU ♡

                </div>


            </div>

        </div>

    </div>



    <script>

        /* BOOT SEQUENCE */

        const bootMessages = [

            "> establishing connection...",

            "> scanning player database...",

            "> player detected: IMANEL",

            "> birthday protocol found...",

            "> quest data loaded.",

            "> system ready."

        ];


        const bootText =
            document.getElementById("bootText");

        const progress =
            document.getElementById("progress");

        const percent =
            document.getElementById("percent");

        const boot =
            document.getElementById("boot");

        const main =
            document.getElementById("main");


        let currentMessage = 0;


        function showBootMessage() {

            if (
                currentMessage >=
                bootMessages.length
            ) {
                return;
            }


            const line =
                document.createElement("div");

            line.textContent =
                bootMessages[currentMessage];

            bootText.appendChild(line);

            currentMessage++;
        }


        let loading = 0;


        const loader =
            setInterval(() => {

                loading += 2;


                progress.style.width =
                    loading + "%";


                percent.textContent =
                    loading + "%";


                if (
                    loading % 16 === 0
                ) {

                    showBootMessage();

                }


                if (
                    loading >= 100
                ) {

                    clearInterval(loader);


                    setTimeout(() => {

                        boot.classList.add(
                            "hide"
                        );


                        main.classList.add(
                            "show"
                        );

                    }, 700);

                }

            }, 45);



        /* BEGIN THE QUEST */

        function startQuest() {

            const button =
                document.querySelector(".begin");


            button.textContent =
                "[ LOADING LEVEL 01... ]";


            button.disabled =
                true;


            document.body.style.transition =
                "opacity 0.8s ease";


            document.body.style.opacity =
                "0";


            setTimeout(() => {

                window.location.href =
                    "quest.html";

            }, 800);

        }

    </script>

</body>
</html>
